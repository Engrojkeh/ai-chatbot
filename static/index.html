<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Naija E-com Support - Digital Concierge</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#FF6B35",
                "secondary": "#2D3436",
                "surface": "#F8F9FA",
                "on-surface": "#2D3436",
                "on-surface-variant": "#636E72",
                "outline-variant": "#DFE6E9",
                "bot-bubble": "#FFFFFF",
                "user-bubble": "#FF6B35",
              },
              fontFamily: {
                "headline": ["Inter", "sans-serif"],
                "body": ["Inter", "sans-serif"],
              },
              boxShadow: {
                'premium': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05)',
                'card': '0 20px 50px rgba(255, 107, 53, 0.1)',
              }
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #FF6B35;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .message-in {
            animation: messageIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .app-container {
            max-width: 450px;
            height: 90vh;
            margin: 5vh auto;
            position: relative;
            background: #F8F9FA;
            overflow: hidden;
        }
        @media (max-width: 640px) {
            .app-container { max-width: 100%; height: 100vh; margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-100 font-body text-on-surface antialiased">
<div class="app-container shadow-card sm:rounded-3xl border border-white/50 flex flex-col">
    
    <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-outline-variant/50 z-20">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-11 h-11 rounded-full bg-orange-50 flex items-center justify-center overflow-hidden border border-orange-100">
                    <span class="material-symbols-outlined text-primary text-2xl" data-icon="smart_toy">smart_toy</span>
                </div>
                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-white"></div>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Naija E-com Support</h1>
                <p class="text-[11px] font-bold text-green-600 uppercase tracking-widest">Online</p>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-5 py-6 space-y-4 hide-scrollbar bg-[#F8F9FA]" id="chat-container">
        
        <div id="dynamic-messages"></div>
        
        <div class="hidden flex flex-col items-start max-w-[85%]" id="typing-indicator">
            <div class="bg-bot-bubble py-3.5 px-5 rounded-2xl rounded-tl-none border border-outline-variant/30 flex items-center gap-1.5 shadow-sm">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </main>

    <div class="bg-white border-t border-outline-variant/30 pb-6 pt-3 px-5">
        <div class="flex gap-2 overflow-x-auto pb-4 hide-scrollbar">
            <button class="whitespace-nowrap bg-white border border-outline-variant text-primary text-xs font-bold py-2.5 px-4 rounded-full shadow-sm hover:border-primary/50 transition-all active:scale-95">Track my order</button>
            <button class="whitespace-nowrap bg-white border border-outline-variant text-primary text-xs font-bold py-2.5 px-4 rounded-full shadow-sm hover:border-primary/50 transition-all active:scale-95">Payment methods</button>
            <button class="whitespace-nowrap bg-white border border-outline-variant text-primary text-xs font-bold py-2.5 px-4 rounded-full shadow-sm hover:border-primary/50 transition-all active:scale-95">Refund policy</button>
        </div>
        
        <div class="flex items-center gap-2.5">
            <div class="flex-1 flex items-center bg-slate-50 border border-slate-200 rounded-2xl px-4 py-1.5 focus-within:bg-white focus-within:border-primary/40 transition-all">
                <input class="flex-1 bg-transparent border-none focus:ring-0 text-sm py-2 text-on-surface placeholder:text-slate-400 outline-none" id="chat-input" placeholder="Type your message..." type="text"/>
            </div>
            <button class="w-11 h-11 bg-primary text-white rounded-2xl flex items-center justify-center shadow-md active:scale-90 transition-all shrink-0" id="send-btn">
                <span class="material-symbols-outlined text-2xl" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
            </button>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const container = document.getElementById('chat-container');
    const dynamicMessages = document.getElementById('dynamic-messages');
    const typingIndicator = document.getElementById('typing-indicator');

    function scrollBottom() {
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }

    function createMessage(text, isUser = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col ${isUser ? 'items-end self-end max-w-[80%]' : 'items-start max-w-[85%]'} message-in mb-4`;
        
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const bubble = document.createElement('div');
        bubble.className = isUser 
            ? 'bg-primary text-white py-3.5 px-4 rounded-2xl rounded-tr-none shadow-md'
            : 'bg-white shadow-sm py-3.5 px-4 rounded-2xl rounded-tl-none border border-outline-variant/30 text-on-surface';
        
        const content = document.createElement('p');
        content.className = 'text-sm leading-relaxed whitespace-pre-line';
        content.textContent = text;
        
        const timeLabel = document.createElement('span');
        timeLabel.className = `text-[10px] text-on-surface-variant mt-1.5 ${isUser ? 'mr-1' : 'ml-1'} font-medium`;
        timeLabel.textContent = time;

        bubble.appendChild(content);
        wrapper.appendChild(bubble);
        wrapper.appendChild(timeLabel);
        
        return wrapper;
    }

    async function handleSend() {
        const text = input.value.trim();
        if (!text) return;

        // 1. Add User Message
        dynamicMessages.appendChild(createMessage(text, true));
        input.value = '';
        scrollBottom();

        // 2. Show Typing Indicator
        typingIndicator.classList.remove('hidden');
        scrollBottom();

        const typingDelay = Math.floor(Math.random() * 1000) + 1000;

        try {
            const isDigit = /^\d+$/.test(text.trim());
            let requestData = { message: text };
            if (isDigit) requestData.order_id = text.trim();
            
            // Connect to backend
            const fetchPromise = fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            });

            const [response] = await Promise.all([
                fetchPromise,
                new Promise(resolve => setTimeout(resolve, typingDelay))
            ]);

            const data = await response.json();
            
            typingIndicator.classList.add('hidden');

            if (data.response) {
                dynamicMessages.appendChild(createMessage(data.response, false));
            } else {
                dynamicMessages.appendChild(createMessage("Sorry, I experienced an issue connecting.", false));
            }
            scrollBottom();

        } catch (error) {
            console.error("Error:", error);
            typingIndicator.classList.add('hidden');
            dynamicMessages.appendChild(createMessage("Error connecting to the server. If this is the first message in a while, the server is just waking up. Try sending again in a few seconds!", false));
            scrollBottom();
        }
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });

    document.querySelectorAll('button.whitespace-nowrap').forEach(btn => {
        btn.addEventListener('click', () => {
            input.value = btn.innerText;
            handleSend();
        });
    });

    // Add Initial Bot Greeting On Page Load
    window.onload = () => {
        const welcomeText = "Hello! Welcome to our store. I am your AI Support Assistant. Here is what I can help you with:\n\n• Track an order\n• Payment methods\n• Refund policy\n\nHow can I assist you today?";
        dynamicMessages.appendChild(createMessage(welcomeText, false));
        scrollBottom();
    };
</script>
</body>
</html>
